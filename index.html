<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bản đồ tư vấn bất động sản — Thành phố Hồ Chí Minh</title>
<meta name="description" content="Bản đồ tư vấn bất động sản theo hạ tầng, metro và tiện ích khu vực Thành phố Hồ Chí Minh. Chỉ hiển thị dữ liệu xác minh được.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1d4ed8">

<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/map.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/client.css">
<link rel="stylesheet" href="css/live.css">
</head>

<body>
<div class="app">

  <!-- Bản đồ nằm dưới cùng; mọi bảng điều khiển nổi lên trên nó.
       Cách này giữ cho ô bản đồ không bao giờ đổi kích thước khi đóng/mở bảng. -->
  <div id="map" role="application" aria-label="Bản đồ dự án bất động sản"></div>

  <!-- ─── Thanh trên ──────────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="brand">
      <div class="brand__mark" aria-hidden="true">🏙</div>
      <div>
        <div class="brand__name">Bản đồ tư vấn BĐS</div>
        <div class="brand__sub">Thành phố Hồ Chí Minh</div>
      </div>
    </div>

    <div class="search">
      <span class="search__icon" aria-hidden="true">🔍</span>
      <input id="tim" class="search__inp" type="search" autocomplete="off"
             placeholder="Tìm dự án, chủ đầu tư, ga metro, tiện ích…"
             aria-label="Tìm kiếm trên bản đồ">
      <div id="ketqua" class="search__res scroll" role="listbox" hidden></div>
    </div>

    <div class="topbar__tools">
      <button class="btn btn--icon" type="button" data-act="panel" aria-pressed="true"
              title="Bảng dự án, lớp bản đồ và bộ lọc" aria-label="Bảng dự án, lớp bản đồ và bộ lọc">☰</button>
      <button class="btn btn--icon" type="button" data-act="so-sanh"
              title="Bảng so sánh dự án" aria-label="Bảng so sánh dự án">⇄</button>
      <button class="btn btn--icon" type="button" data-act="reset"
              title="Về khung nhìn ban đầu" aria-label="Về khung nhìn ban đầu">⌂</button>
      <span class="topbar__sep" aria-hidden="true"></span>
      <button class="btn btn--icon" type="button" data-act="bien-tap" aria-pressed="false"
              title="Chế độ biên tập GIS — công cụ nội bộ, không phải dữ liệu công bố"
              aria-label="Chế độ biên tập GIS">🛠</button>
      <button class="btn btn--icon" type="button" data-act="dev-mode" aria-pressed="false"
              title="Developer Mode — bắt lỗi JS/Promise/dữ liệu" aria-label="Developer Mode">🐞</button>
      <button class="btn btn--icon" type="button" data-act="chu-de"
              title="Đổi nền sáng / tối" aria-label="Đổi nền sáng tối">☾</button>
      <button class="btn btn--primary" type="button" data-act="live-mode"
              title="LIVE MODE — chế độ trình bày cho livestream">
        <span aria-hidden="true">🎬</span><span class="btn__lbl">Live</span>
      </button>
      <button class="btn btn--primary" type="button" data-act="gui-khach"
              title="Ẩn menu, chỉ hiện thông tin để chụp màn hình gửi khách">
        <span aria-hidden="true">📤</span><span class="btn__lbl">Gửi khách</span>
      </button>
    </div>
  </header>

  <!-- ─── Bảng trái ───────────────────────────────────────────────────── -->
  <aside class="panel" aria-label="Danh sách dự án, lớp bản đồ và bộ lọc">
    <div class="panel__tabs" role="tablist"></div>
    <!-- Ô lọc nằm NGOÀI .panel__body vì phần thân được vẽ lại sau mỗi lần gõ;
         để bên trong thì ô nhập bị thay và mất con trỏ ngay ký tự đầu tiên. -->
    <div class="panel__search">
      <input id="loc-ten" class="inp" type="search" autocomplete="off"
             placeholder="Lọc theo tên, chủ đầu tư, địa chỉ…"
             aria-label="Lọc danh sách dự án">
    </div>
    <div class="panel__body scroll"></div>
    <div class="panel__foot"></div>
  </aside>

  <!-- ─── Hồ sơ dự án ─────────────────────────────────────────────────── -->
  <aside class="sidebar" aria-label="Hồ sơ dự án" hidden>
    <div class="sb__tabs scroll" role="tablist"></div>
    <div class="sb__body scroll"></div>
  </aside>

  <!-- ─── Bảng so sánh ────────────────────────────────────────────────── -->
  <section class="cmp" aria-label="Bảng so sánh dự án" hidden></section>

  <!-- ─── Chế độ gửi khách ────────────────────────────────────────────── -->
  <section class="ck" aria-label="Thẻ thông tin gửi khách" hidden></section>

  <!-- ─── LIVE MODE — lớp trình bày cho livestream ────────────────────── -->
  <section class="lv" aria-label="Live Mode" hidden></section>

  <!-- ─── Chế độ biên tập GIS — công cụ nội bộ, không phải trang công bố ── -->
  <aside class="editor" aria-label="Chế độ biên tập GIS" hidden></aside>

  <!-- ─── Kiểm tra dữ liệu — báo cáo lỗi, chỉ đọc ─────────────────────── -->
  <section class="cmp checker" aria-label="Kiểm tra dữ liệu" hidden></section>

  <!-- ─── Developer Mode — bắt lỗi JS/Promise/dữ liệu ─────────────────── -->
  <aside class="editor devmode" aria-label="Developer Mode" hidden></aside>

  <!-- ─── Nút điều khiển bản đồ và chú thích ──────────────────────────── -->
  <div class="mapctl" role="group" aria-label="Điều khiển bản đồ"></div>
  <div class="legend hidden" aria-label="Chú thích bản đồ"></div>

  <!-- ─── Màn hình chờ ────────────────────────────────────────────────── -->
  <div id="boot" class="boot">
    <div class="boot__mark" aria-hidden="true">🏙</div>
    <div class="boot__title">Bản đồ tư vấn bất động sản</div>
    <div class="boot__step">Đang khởi động…</div>
    <div class="boot__bar"><span></span></div>
  </div>

</div>

<!-- crossorigin bắt buộc: thiếu nó thì mọi lỗi ném ra từ Leaflet bị trình duyệt
     che thành "Script error." không có dòng, không có tệp — không gỡ được. -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
